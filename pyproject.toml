[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "APOSTRUCT"
version = "0.1.0"
description = "Local symmetry-analysis engine for crystalline distortions"
readme = "README.md"
license = "0BSD"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
  "gemmi",
  "numpy",
  "sympy",
]

[project.optional-dependencies]
verification = ["scipy"]

[project.scripts]
apo = "APOSTRUCT.cli:main"
apostruct-compare = "Verification.verify_comparison:main"
apostruct-verify-local = "Verification.verify_local_output:main"
apostruct-verify-web = "Verification.verify_web_text:main"
apostruct-validation-summary = "Verification.reproduce:main"

[tool.setuptools.packages.find]
include = ["APOSTRUCT*", "Source", "Verification*"]
exclude = ["APOSTRUCT.debug*"]
namespaces = true

[tool.setuptools.package-data]
"Source" = ["*.dat", "*.txt", "README.md"]
"APOSTRUCT" = [
  "Frontend/*.csv",
  "Frontend/*.css",
  "Frontend/*.html",
  "Frontend/*.js",
  "Frontend/vendor/*.js",
  "Frontend/vendor/*.txt",
  "Frontend/vendor/addons/controls/*.js",
  "Frontend/vendor/addons/geometries/*.js",
  "Frontend/vendor/addons/math/*.js",
  "Backend/source/_compiled/*.npy",
  "Backend/source/_compiled/manifest.json",
  "Backend/source/_compiled/README.md",
]
"Verification.mathematics" = [
  "data/*.md",
  "data/*.txt",
  "data/*.gz",
  "data/upstream/spglib-2.7.0/*.yaml",
  "data/upstream/spglib-2.7.0/*.csv",
]

[tool.setuptools.exclude-package-data]
"APOSTRUCT" = ["Frontend/debug-fetch-worker.js"]
