[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "APOSTRUCT"
version = "0.1.0"
description = "Local symmetry-analysis engine for crystalline distortions"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "gemmi",
  "numpy",
  "sympy",
]

[project.scripts]
apo = "APOSTRUCT.cli:main"

[tool.setuptools.packages.find]
include = ["APOSTRUCT*", "Source"]
exclude = ["APOSTRUCT.debug*"]
namespaces = true

[tool.setuptools.package-data]
"Source" = ["*.dat", "*.txt", "README.md"]
"APOSTRUCT" = [
  "Frontend/*.csv",
  "Frontend/*.css",
  "Frontend/*.html",
  "Frontend/*.js",
  "Frontend/vendor/*.js",
  "Frontend/vendor/*.txt",
  "Frontend/vendor/addons/controls/*.js",
  "Frontend/vendor/addons/geometries/*.js",
  "Frontend/vendor/addons/math/*.js",
  "Backend/source/_compiled/*.npy",
  "Backend/source/_compiled/manifest.json",
  "Backend/source/_compiled/README.md",
]

[tool.setuptools.exclude-package-data]
"APOSTRUCT" = ["Frontend/debug-fetch-worker.js"]
