[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "distortropy"
version = "0.1.0"
description = "Pure-Python implementation of the ISODISTORT calculation engine"
keywords = [
  "ISODISTORT",
  "ISOTROPY",
  "crystallography",
  "group theory",
  "magnetic structures",
  "symmetry modes",
]
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
  "License :: Public Domain",
]
dependencies = [
  "gemmi",
  "numpy",
  "sympy",
]

[project.scripts]
distortropy = "ISODISTORT.Assembled.cli:main"
isodistort = "ISODISTORT.Assembled.cli:main"

[tool.setuptools.packages.find]
include = ["ISODISTORT*", "Source"]
namespaces = true

[tool.setuptools.package-data]
"Source" = ["*.dat", "*.txt", "README.md"]
"ISODISTORT.Assembled" = [
  "Frontend/*.csv",
  "Frontend/*.css",
  "Frontend/*.html",
  "Frontend/*.js",
  "Frontend/vendor/*.js",
  "Frontend/vendor/*.txt",
  "Frontend/vendor/addons/controls/*.js",
  "Frontend/vendor/addons/geometries/*.js",
  "Frontend/vendor/addons/math/*.js",
]
