[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "distortropy"
version = "0.1.0"
description = "Local symmetry-analysis engine for crystalline distortions"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "gemmi",
  "numpy",
  "sympy",
]

[project.scripts]
distortropy = "distortropy.cli:main"

[tool.setuptools.packages.find]
include = ["distortropy*", "Source"]
exclude = ["distortropy.debug*"]
namespaces = true

[tool.setuptools.package-data]
"Source" = ["*.dat", "*.txt", "README.md"]
"distortropy" = [
  "Frontend/*.csv",
  "Frontend/*.css",
  "Frontend/*.html",
  "Frontend/*.js",
  "Frontend/vendor/*.js",
  "Frontend/vendor/*.txt",
  "Frontend/vendor/addons/controls/*.js",
  "Frontend/vendor/addons/geometries/*.js",
  "Frontend/vendor/addons/math/*.js",
]

[tool.setuptools.exclude-package-data]
"distortropy" = ["Frontend/debug-fetch-worker.js"]
