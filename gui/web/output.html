<!DOCTYPE html>
<html lang="ja" class="output-document">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>APOSTRUCT — Output</title>
  <link rel="stylesheet" href="theme.css?v=6">
  <link rel="stylesheet" href="tool.css?v=106">
  <link rel="stylesheet" href="output.css?v=78">
  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three.module.js",
        "three/addons/": "./vendor/addons/"
      }
    }
  </script>
</head>
<body class="output-window">
  <main class="page output-page single-result">
    <div id="output-tabs" class="output-tabs" hidden role="tablist" aria-label="Calculated results"></div>
    <p id="output-empty" class="output-empty">No results. Calculate a result in the input window.</p>
    <section class="output-block" id="mode-details-section" role="tabpanel" hidden>
      <div class="mode-viewer-workspace">
        <aside class="mode-viewer-sidebar surface-panel" aria-label="Result and mode controls">
          <header class="output-heading">
            <p id="result-title">APOSTRUCT — Output</p>
            <span id="output-status" role="status" hidden>Waiting for a calculated result from the input window…</span>
            <p id="output-error" class="error" role="alert" hidden></p>
            <div class="mode-viewer-display-options">
              <label><input id="mode-viewer-bonds" type="checkbox" checked> Bonds</label>
              <label><input id="mode-viewer-polyhedra" type="checkbox" checked> Polyhedra</label>
            </div>
          </header>
          <div id="mode-viewer-controls" class="mode-viewer-controls"></div>
        </aside>
        <div class="mode-viewer-resizer" role="separator" aria-label="Resize mode controls" aria-orientation="vertical" tabindex="0"></div>
        <div class="output-results">
          <section id="mode-details-viewer-panel" class="mode-viewer-shell" role="tabpanel" aria-label="Interactive mode viewer">
            <div class="mode-viewer-stage">
              <div class="mode-viewer-canvas-wrap surface-panel">
                <canvas id="mode-viewer-canvas"></canvas>
                <button class="mode-viewer-home" id="mode-viewer-home" type="button" aria-label="Restore default view" title="Restore default view">
                  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11.2 12 3l9 8.2v9.3h-6.1v-6.2H9.1v6.2H3z"/></svg>
                </button>
                <div id="mode-viewer-empty" class="mode-viewer-empty">Calculate mode details to open the viewer</div>
              </div>
            </div>
          </section>
        </div>
      </div>
    </section>
  </main>
  <script type="module" src="output.js?v=32"></script>
</body>
</html>
